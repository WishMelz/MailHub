name: mailhub

services:
  api:
    image: docker.io/wishmelz/mailhub-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 57711
      RUN_MIGRATIONS: "true"
      WEB_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      DATABASE_PATH: /app/data/outlook-manage.sqlite
      DB_LOGGING: ${DB_LOGGING:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-168}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-outlook_manage_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      OUTBOUND_HTTP_TIMEOUT_MS: ${OUTBOUND_HTTP_TIMEOUT_MS:-30000}
      MAIL_SYNC_TIMEOUT_MS: ${MAIL_SYNC_TIMEOUT_MS:-300000}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-26214400}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      MICROSOFT_OAUTH_SCOPES: ${MICROSOFT_OAUTH_SCOPES:-openid profile email offline_access User.Read Mail.ReadWrite}
      MICROSOFT_GRAPH_BASE_URL: ${MICROSOFT_GRAPH_BASE_URL:-https://graph.microsoft.com/v1.0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES:-openid email profile https://www.googleapis.com/auth/gmail.readonly}
      GMAIL_API_BASE_URL: ${GMAIL_API_BASE_URL:-https://gmail.googleapis.com/gmail/v1}
      GOOGLE_GMAIL_REQUEST_INTERVAL_MS: ${GOOGLE_GMAIL_REQUEST_INTERVAL_MS:-100}
      GOOGLE_GMAIL_SYNC_PAGE_SIZE: ${GOOGLE_GMAIL_SYNC_PAGE_SIZE:-25}
      GOOGLE_GMAIL_WATCH_ENABLED: ${GOOGLE_GMAIL_WATCH_ENABLED:-false}
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-}
      GOOGLE_GMAIL_PUBSUB_TOPIC: ${GOOGLE_GMAIL_PUBSUB_TOPIC:-}
      GOOGLE_GMAIL_PUBSUB_AUDIENCE: ${GOOGLE_GMAIL_PUBSUB_AUDIENCE:-}
      GOOGLE_GMAIL_PUBSUB_SERVICE_ACCOUNT: ${GOOGLE_GMAIL_PUBSUB_SERVICE_ACCOUNT:-}
      GOOGLE_GMAIL_PUBSUB_SUBSCRIPTION: ${GOOGLE_GMAIL_PUBSUB_SUBSCRIPTION:-}
      GOOGLE_GMAIL_WATCH_DEFAULT_MINUTES: ${GOOGLE_GMAIL_WATCH_DEFAULT_MINUTES:-30}
      GOOGLE_GMAIL_WATCH_RENEW_BEFORE_MINUTES: ${GOOGLE_GMAIL_WATCH_RENEW_BEFORE_MINUTES:-1440}
      GOOGLE_GMAIL_HISTORY_PAGE_SIZE: ${GOOGLE_GMAIL_HISTORY_PAGE_SIZE:-100}
      GOOGLE_GMAIL_HISTORY_RETRY_LIMIT: ${GOOGLE_GMAIL_HISTORY_RETRY_LIMIT:-5}
      GOOGLE_GMAIL_COMPENSATION_INTERVAL_MINUTES: ${GOOGLE_GMAIL_COMPENSATION_INTERVAL_MINUTES:-60}
      GOOGLE_GMAIL_PUSH_EVENT_RETENTION_HOURS: ${GOOGLE_GMAIL_PUSH_EVENT_RETENTION_HOURS:-168}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "57711"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:57711/api/health/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: docker.io/wishmelz/mailhub-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
